<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my basboosa</title>
<style>
  :root {
    --pink-bg: #ffd6e8;
    --pink-deep: #ff8fc4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: linear-gradient(180deg, #ffe3f0 0%, #ffd0e6 50%, #ffc2df 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* floating hearts background */
  .heart {
    position: fixed;
    top: -60px;
    font-size: 24px;
    opacity: 0.85;
    user-select: none;
    pointer-events: none;
    animation-name: floatDown;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    z-index: 1;
  }

  @keyframes floatDown {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    50% {
      transform: translateY(50vh) translateX(20px) rotate(15deg);
    }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(105vh) translateX(-15px) rotate(-10deg);
      opacity: 0;
    }
  }

  /* the centred floating photo */
  .center-wrap {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 40px 20px;
  }

  .photo-frame {
    width: min(62vw, 320px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(214, 51, 132, 0.35), 0 0 0 8px #ffffffaa;
    animation: bob 4.5s ease-in-out infinite;
    background: #fff;
  }

  .photo-frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-22px) rotate(1.5deg); }
  }

  .title-text {
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    color: #d6337f;
    text-shadow: 0 3px 0 #fff, 0 6px 18px rgba(214, 51, 132, 0.4);
    text-align: center;
    margin: 0;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* falling basboosa images */
  .basboosa-drop {
    position: fixed;
    top: -180px;
    z-index: 2;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    animation-name: dropDown;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.95;
  }

  .basboosa-drop img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
  }

  @keyframes dropDown {
    0% { transform: translateY(-20vh) rotate(-8deg); opacity: 0; }
    8% { opacity: 0.95; }
    92% { opacity: 0.95; }
    100% { transform: translateY(120vh) rotate(10deg); opacity: 0; }
  }

  footer {
    position: relative;
    z-index: 5;
    text-align: center;
    color: #b53a75;
    font-size: 0.85rem;
    padding-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hearts" id="hearts"></div>

    <div class="basboosa-drop" style="left:8%; width:120px; animation-duration:9s; animation-delay:0s;">
      <img src="images/basboosa1.jpg" alt="basboosa">
    </div>
    <div class="basboosa-drop" style="left:78%; width:100px; animation-duration:11s; animation-delay:3s;">
      <img src="images/basboosa2.jpg" alt="basboosa">
    </div>
    <div class="basboosa-drop" style="left:45%; width:90px; animation-duration:8s; animation-delay:6s;">
      <img src="images/basboosa1.jpg" alt="basboosa">
    </div>

    <div class="center-wrap">
      <h1 class="title-text">my basboosa 💘💖</h1>
      <div class="photo-frame">
        <img src="images/her.jpg" alt="my basboosa">
      </div>
    </div>
  </div>

  <script>
    // scatter floating heart emojis across the page
    const hearts = ["💗","💖","💕","💓","💞","💘","❤️","🩷","💝"];
    const container = document.getElementById("hearts");
    const count = 45;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (16 + Math.random() * 26) + "px";
      el.style.animationDuration = (6 + Math.random() * 10) + "s";
      el.style.animationDelay = (Math.random() * -15) + "s";
      container.appendChild(el);
    }
  </script>
</body>
</html>
