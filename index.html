<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my basboosa</title>
<style>
  :root {
    --pink-bg: #ffd6e8;
    --pink-deep: #ff8fc4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: linear-gradient(180deg, #ffe3f0 0%, #ffd0e6 50%, #ffc2df 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* floating hearts background */
  .heart {
    position: fixed;
    top: -60px;
    font-size: 24px;
    opacity: 0.85;
    user-select: none;
    pointer-events: none;
    animation-name: floatDown;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    z-index: 1;
  }

  @keyframes floatDown {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    50% {
      transform: translateY(50vh) translateX(20px) rotate(15deg);
    }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(105vh) translateX(-15px) rotate(-10deg);
      opacity: 0;
    }
  }

  /* the centred floating photo */
  .center-wrap {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 40px 20px;
  }

  .photo-stack {
    position: relative;
    width: min(62vw, 320px);
  }

  .behind-frame {
    position: absolute;
    top: -85px;
    left: 50%;
    width: 78%;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(80, 40, 90, 0.4), 0 0 0 8px #ffffffaa;
    background: #fff;
    z-index: 1;
    transform: translateX(-50%) translateY(30px) scale(0.85);
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }

  .behind-frame.revealed {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .behind-frame.revealed img.bounce {
    animation: bounceClick 0.6s ease;
  }

  .behind-frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  .photo-scaler {
    position: relative;
    width: 100%;
    z-index: 5;
    transform-origin: center bottom;
    transform: scale(1);
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }

  .photo-scaler.shrunk {
    transform: scale(0.8);
  }

  .photo-frame {
    position: relative;
    width: 100%;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(214, 51, 132, 0.35), 0 0 0 8px #ffffffaa;
    animation: bob 4.5s ease-in-out infinite;
    background: #fff;
    cursor: pointer;
  }

  .photo-frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  .photo-frame img.bounce {
    animation: bounceClick 0.6s ease;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-22px) rotate(1.5deg); }
  }

  @keyframes bounceClick {
    0%   { transform: scale(1) translateY(0); }
    30%  { transform: scale(1.08) translateY(-16px); }
    55%  { transform: scale(0.96) translateY(6px); }
    80%  { transform: scale(1.03) translateY(-3px); }
    100% { transform: scale(1) translateY(0); }
  }

  .title-text {
    font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(3rem, 11vw, 5.2rem);
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    margin: 0;
    padding: 0 10px;
    background: linear-gradient(90deg, #ff2d6b, #ff8fc4, #ffd700, #ff2d6b);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 0 rgba(255,255,255,0.7)) drop-shadow(0 10px 26px rgba(214, 20, 100, 0.55));
    animation: pulse 2s ease-in-out infinite, shimmer 5s linear infinite;
  }

  .title-flourish {
    display: block;
    text-align: center;
    color: #c21e64;
    font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(1rem, 3vw, 1.4rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: -6px;
    text-shadow: 0 2px 0 #fff;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    25% { transform: scale(1.09) rotate(0.5deg); }
    50% { transform: scale(1.02) rotate(-0.5deg); }
    75% { transform: scale(1.1) rotate(1deg); }
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }

  /* falling basboosa images */
  .basboosa-drop {
    position: fixed;
    top: -180px;
    z-index: 2;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    animation-name: dropDown;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.95;
  }

  .basboosa-drop img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
  }

  @keyframes dropDown {
    0% { transform: translateY(-20vh) rotate(-8deg); opacity: 0; }
    8% { opacity: 0.95; }
    92% { opacity: 0.95; }
    100% { transform: translateY(120vh) rotate(10deg); opacity: 0; }
  }

  footer {
    position: relative;
    z-index: 5;
    text-align: center;
    color: #b53a75;
    font-size: 0.85rem;
    padding-bottom: 24px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hearts" id="hearts"></div>

    <div class="basboosa-drop" style="left:8%; width:120px; animation-duration:9s; animation-delay:0s;">
      <img src="images/basboosa1.jpg" alt="basboosa">
    </div>
    <div class="basboosa-drop" style="left:78%; width:100px; animation-duration:11s; animation-delay:3s;">
      <img src="images/basboosa2.jpg" alt="basboosa">
    </div>
    <div class="basboosa-drop" style="left:45%; width:90px; animation-duration:8s; animation-delay:6s;">
      <img src="images/basboosa1.jpg" alt="basboosa">
    </div>

    <div class="center-wrap">
      <h1 class="title-text">my basboosa 💘💖</h1>
      <span class="title-flourish">✦ my heart, my sweetest one ✦</span>
      <div class="photo-stack" id="photoStack">
        <div class="behind-frame" id="behindFrame">
          <img src="images/him.jpg" alt="standing behind her" id="himImg">
        </div>
        <div class="photo-scaler" id="photoScaler">
          <div class="photo-frame" id="photoFrame">
            <img src="images/her.jpg" alt="my basboosa" id="herImg">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // scatter floating heart emojis across the page
    const hearts = ["💗","💖","💕","💓","💞","💘","❤️","🩷","💝"];
    const container = document.getElementById("hearts");
    const count = 45;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (16 + Math.random() * 26) + "px";
      el.style.animationDuration = (6 + Math.random() * 10) + "s";
      el.style.animationDelay = (Math.random() * -15) + "s";
      container.appendChild(el);
    }

    // click her photo: reveal him standing above/behind her, he bounces, then she bounces right after
    const photoFrame = document.getElementById("photoFrame");
    const behindFrame = document.getElementById("behindFrame");
    const herImg = document.getElementById("herImg");
    const himImg = document.getElementById("himImg");
    const photoScaler = document.getElementById("photoScaler");
    let firstClick = true;

    function rebounce(el) {
      el.classList.remove("bounce");
      void el.offsetWidth; // restart animation
      el.classList.add("bounce");
    }

    photoFrame.addEventListener("click", () => {
      behindFrame.classList.add("revealed");
      if (firstClick) {
        photoScaler.classList.add("shrunk");
        firstClick = false;
      }
      rebounce(himImg);
      setTimeout(() => rebounce(herImg), 200);
    });
  </script>
</body>
</html>
